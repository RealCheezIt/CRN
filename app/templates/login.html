<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Premium Dashboard</title>
    <style>

        @import url('https://googleapis.com');

        :root {
            --primary-color: #d7263d;
            --primary-hover: #b81d31;
            --bg-global: #02182b;
            --bg-card: #09253e;
            --bg-form: #02182b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e3a5f;
            --shadow-premium: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-global);
            padding: 20px;
        }


        .login-container {
            display: flex;
            width: 1060px;
            height: 640px;
            background-color: var(--bg-card);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-premium);
            border: 1px solid #143554;
        }


        .left-banner {
            flex: 1.1;
            background: linear-gradient(135deg, #02182b 0%, #d7263d 50%, #8a1323 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 60px;
            color: #ffffff;
            overflow: hidden;
        }


        .left-banner::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .banner-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            line-height: 1.3;
            color: #ffffff;
        }

        .banner-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 400;
            line-height: 1.6;
        }


        .right-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
        }


        .title-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .title-header p {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }


        .form-box {
            width: 100%;
            max-width: 360px;
            background-color: var(--bg-form);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }


        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }


        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }


        .input-group input {
            width: 100%;
            height: 48px;
            background-color: #09253e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0 16px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: var(--transition-smooth);
        }

        .input-group input::placeholder {
            color: #64748b;
        }


        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(215, 38, 61, 0.25);
        }


        .submit-btn {
            width: 100%;
            height: 48px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-transform: lowercase;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(215, 38, 61, 0.3);
            transition: var(--transition-smooth);
            margin-top: 8px;
        }


        .submit-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(215, 38, 61, 0.4);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>


    <div class="login-container">


        <div class="left-banner">
            <div class="banner-content">
                <h2 class="banner-title">Welcome back to<br>CRN</h2>
                <p class="banner-desc">blah blah blah.<br>blah blah blahhhh.</p>
            </div>
        </div>


        <div class="right-form">


            <div class="title-header">
                <h1>SIGN IN</h1>
                <p>계정에 로그인하세요</p>
            </div>


            <form class="form-box" action="/login_test" method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="input-group">
                    <input type="text" name="user_id" placeholder="Nickname" required autocomplete="off">

                </div>

                <div class="input-group">
                    <input type="password" name="user_pw" placeholder="Password" required>
                </div>

                 <button type="submit" class="submit-btn">submit</button>




            </form>



        </div>
    </div>

</body>
</html>
