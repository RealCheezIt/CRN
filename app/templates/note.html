<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오답 노트 기록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-label { font-weight: bold; }
        .header-title { text-align: center; margin-bottom: 30px; color: #0d6efd; }
    </style>
</head>
<head>
    ...
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
</head>
<body>

<div class="container">
    <h2 class="header-title">오답 노트 작성</h2>
    
<form action="{{ url_for('notes.edit_note', note_id=note[0]) if note else url_for('notes.save_note') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
        <label for="problemName" class="form-label">문제 이름</label>
        <input type="text" class="form-control" name="title" id="problemName"
               value="{{ note[2] if note else '' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">카테고리</label>
        <select class="form-select" name="category" required>
            <option value="" {% if not note %}selected{% endif %} disabled>카테고리를 선택하세요</option>
            <option value="web" {% if note and note[3] == 'web' %}selected{% endif %}>Web</option>
            <option value="pwn" {% if note and note[3] == 'pwn' %}selected{% endif %}>Pwnable</option>
            <option value="crypto" {% if note and note[3] == 'crypto' %}selected{% endif %}>Crypto</option>
            <option value="rev" {% if note and note[3] == 'rev' %}selected{% endif %}>Reversing</option>
            <option value="misc" {% if note and note[3] == 'misc' %}selected{% endif %}>Misc</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="learned" class="form-label">배운 점 및 메모</label>
        <textarea class="form-control" name="content" rows="5">{{ note[4] if note else '' }}</textarea>
    </div>

    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary btn-lg">{{ '수정하기' if note else '노트 저장하기' }}</button>
    </div>
</form>
</div>
<script>
const textarea = document.getElementById('learned');
const preview = document.getElementById('preview');

function updatePreview() {
    const rawHtml = marked.parse(textarea.value);
    const cleanHtml = DOMPurify.sanitize(rawHtml);  // XSS 필터링
    preview.innerHTML = cleanHtml;
    preview.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);  // 코드블록마다 하이라이팅 적용
    });
}

textarea.addEventListener('input', updatePreview);
updatePreview();  // 페이지 로드 시(수정 모드일 때 기존 내용) 한 번 실행
</script>

</body>
</html>
