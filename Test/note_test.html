<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오답 노트 기록</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #f8fafc;
            color: #1e293b;
        }


        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #246bfd 0%, #0047da 100%);
            padding: 40px 24px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            z-index: 10;
        }

        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 50px 60px;
            max-width: 1000px;
        }

        /* 사이드바 브랜딩 */
        .sidebar-brand h2 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.4;
        }

        .sidebar-brand span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            display: block;
            margin-top: 5px;
        }

        .btn-back-sidebar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 8px;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
        }
        .btn-back-sidebar:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
        }


        .page-header {
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #111111;
        }


        .form-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            border: 1px solid #e2e8f0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }


        input[type="text"], select, textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #1a202c;
            background-color: #f8fafc;
            transition: all 0.2s ease-in-out;
            outline: none;
        }

        input[type="text"], select {
            height: 48px;
            padding: 0 16px;
        }

        textarea {
            padding: 16px;
            resize: vertical;
            min-height: 180px;
            line-height: 1.6;
        }

        input::placeholder, textarea::placeholder {
            color: #cbd5e1;
        }


        input:focus, select:focus, textarea:focus {
            background-color: #ffffff;
            border-color: #246bfd;
            box-shadow: 0 0 0 3px rgba(36, 107, 253, 0.15);
        }


        .btn-submit {
            width: 100%;
            height: 52px;
            background-color: #246bfd;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1a56cc;
        }
    </style>
</head>
<body>


    <div class="sidebar">
        <div class="sidebar-brand">
            <h2>{{ '노트 수정' if note else '새 노트 작성' }}</h2>
            <span>지식을 내 것으로 만드는 시간</span>
        </div>


        <a href="javascript:history.back();" class="btn-back-sidebar">⬅️ 작성 취소하기</a>
    </div>


    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">{{ '오답 노트 수정하기' if note else '새로운 오답 노트 작성' }}</h1>
        </div>


        <div class="form-card">


            <form action="{{ url_for('notes.edit_note', note_id=note[0]) if note else url_for('notes.save_note') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


                <div class="form-group">
                    <label for="problemName" class="form-label">문제 이름</label>
                    <input type="text" name="title" id="problemName"
                           value="{{ note[2] if note else '' }}" required placeholder="문제를 파악할 수 있는 제목을 적어주세요.">
                </div>


                <div class="form-group">
                    <label class="form-label">카테고리</label>
                    <select name="category" required>
                        <option value="" {% if not note %}selected{% endif %} disabled>카테고리를 선택하세요</option>
                        <option value="web" {% if note and note[3] == 'web' %}selected{% endif %}>Web</option>
                        <option value="pwn" {% if note and note[3] == 'pwn' %}selected{% endif %}>Pwnable</option>
                        <option value="crypto" {% if note and note[3] == 'crypto' %}selected{% endif %}>Crypto</option>
                        <option value="rev" {% if note and note[3] == 'rev' %}selected{% endif %}>Reversing</option>
                        <option value="misc" {% if note and note[3] == 'misc' %}selected{% endif %}>Misc</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="tags" class="form-label">태그 (쉼표로 구분)</label>
                    <input type="text" name="tags" id="tags"
                           value="{{ note_tags | join(', ') if note_tags else '' }}"
                           placeholder="예: 기드라, 정적분석, PE파일">
                </div>


                <div class="form-group">
                    <label for="learned" class="form-label">배운 점 및 메모 (Markdown 지원)</label>
                    <textarea name="content" id="learned" placeholder="풀이 과정이나 핵심 코드를 마크다운 형식으로 자유롭게 기록하세요...">{{ note[4] if note else '' }}</textarea>
                </div>


                <button type="submit" class="btn-submit">
                    {{ ' 수정 완료하기' if note else ' 노트 저장하기' }}
                </button>
            </form>

        </div>
    </div>

</body>
</html>
