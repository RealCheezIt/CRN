<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
        }


        .login-container {
            display: flex;
            width: 1000px;
            height: 600px;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }


        .left-banner {
            flex: 1;
            background-color: #246bfd;
        }


        .right-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }


        .title-bar {
            width: 80%;
            max-width: 320px;
            background-color: #e9e9e9;
            text-align: center;
            padding: 15px 0;
            border-radius: 20px;
            font-size: 24px;
            font-weight: 800;
            color: #000000;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }


        .form-box {
            width: 80%;
            max-width: 320px;
            background-color: #e9e9e9;
            border-radius: 24px;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }


        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 700;
            color: #333333;
            padding-left: 5px;
        }


        .input-group input {
            width: 100%;
            height: 45px;
            background-color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
        }


        .input-group input:focus {
            box-shadow: 0 0 0 2px #246bfd;
        }


        .submit-btn {
            width: 100%;
            height: 45px;
            background-color: #246bfd;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }


        .submit-btn:hover {
            background-color: #1a56cc;
        }
    </style>
</head>
<body>


    <div class="login-container">


        <div class="left-banner"></div>


        <div class="right-form">


            <div class="title-bar">SIGN IN</div>


            <form class="form-box" action="/login" method="POST">


                <div class="input-group">
                    <label for="username">ID</label>
                    <input type="text" id="username" name="username" required autocomplete="off">
                </div>


                <div class="input-group">
                    <label for="password">PW</label>
                    <input type="password" id="password" name="password" required>
                </div>


                <button type="submit" class="submit-btn">submit</button>

            </form>

        </div>
    </div>

</body>
</html>
